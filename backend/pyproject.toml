# Tool settings of the backend. Dependencies are pinned in requirements*.txt.
[project]
name = "coteach-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -p no:cacheprovider"
markers = [
  "models: tests that need real downloaded models (run with make test-models, not with make test)",
]
