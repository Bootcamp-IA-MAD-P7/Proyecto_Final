# Production overrides: `docker compose -f compose.yaml -f compose.production.yaml up -d` (`make up-prod`).
# Typical content: the `prod` build target, restart policies and no source mounts or debug ports.

services:
  backend:
    build:
      target: prod
    restart: unless-stopped
    environment:
      # Off in production; set AUTH_DEV_ISSUER=true in .env only for a local demo (spec api-access).
      AUTH_DEV_ISSUER: ${AUTH_DEV_ISSUER:-false}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - audio-data:/app/data/audio

  worker:
    build:
      target: prod
    restart: unless-stopped
    volumes:
      - audio-data:/app/data/audio

  maintenance:
    build:
      target: prod
    restart: unless-stopped
    volumes:
      - audio-data:/app/data/audio

  db:
    restart: unless-stopped

  frontend:
    build:
      target: prod
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
        VITE_API_MOCKS: "false"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
