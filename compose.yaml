# Base configuration shared by every environment (CONTRIBUTING §10).
#   Development: `make up`      -> compose.yaml + compose.override.yaml (loaded automatically)
#   Production:  `make up-prod` -> compose.yaml + compose.production.yaml
# Services of the walking skeleton (openspec/changes/add-walking-skeleton/design.md).

name: ${COMPOSE_PROJECT_NAME:-app}

services:
  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    environment:
      # Inside Compose the database is the `db` service; backend/.env points to localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coteach}:${POSTGRES_PASSWORD:-coteach}@db:5432/${POSTGRES_DB:-coteach}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coteach}:${POSTGRES_PASSWORD:-coteach}@db:5432/${POSTGRES_DB:-coteach}_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coteach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coteach}
      POSTGRES_DB: ${POSTGRES_DB:-coteach}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
    env_file: ./frontend/.env

volumes:
  db-data:
