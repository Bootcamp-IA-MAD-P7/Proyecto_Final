# Base configuration shared by every environment (CONTRIBUTING §10).
#   Development: `make up`      -> compose.yaml + compose.override.yaml (loaded automatically)
#   Production:  `make up-prod` -> compose.yaml + compose.production.yaml
# Services of the walking skeleton (openspec/changes/archive/2026-11-25-add-walking-skeleton/design.md).

name: ${COMPOSE_PROJECT_NAME:-app}

services:
  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    environment:
      # Inside Compose the database is the `db` service; backend/.env points to localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coteach}:${POSTGRES_PASSWORD:-coteach}@db:5432/${POSTGRES_DB:-coteach}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coteach}:${POSTGRES_PASSWORD:-coteach}@db:5432/${POSTGRES_DB:-coteach}_test
      AUDIO_STORAGE_DIR: ${AUDIO_STORAGE_DIR:-data/audio}
    volumes:
      - audio-data:/app/data/audio
    depends_on:
      db:
        condition: service_healthy
    # Ready once the migrations are applied and the database answers (GET /ready).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Same image as `backend`, another command (ADR-0001). JobStore in PostgreSQL and FakePipeline.
  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coteach}:${POSTGRES_PASSWORD:-coteach}@db:5432/${POSTGRES_DB:-coteach}
      AUDIO_STORAGE_DIR: ${AUDIO_STORAGE_DIR:-data/audio}
    volumes:
      - audio-data:/app/data/audio
    # `backend` applies the migrations when it starts; the worker needs its tables.
    depends_on:
      backend:
        condition: service_healthy

  maintenance:
    build:
      context: ./backend
    command: ["python", "-m", "app.maintenance"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-coteach}:${POSTGRES_PASSWORD:-coteach}@db:5432/${POSTGRES_DB:-coteach}
      AUDIO_STORAGE_DIR: ${AUDIO_STORAGE_DIR:-data/audio}
    volumes:
      - audio-data:/app/data/audio
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coteach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coteach}
      POSTGRES_DB: ${POSTGRES_DB:-coteach}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
    env_file: ./frontend/.env

volumes:
  db-data:
  # Private audio of the classes, shared by backend, worker and maintenance (ADR-0004).
  audio-data:
